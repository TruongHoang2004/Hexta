name: Codebase Scout & Tech Debt Audit

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not create GitHub issues)'
        required: false
        type: boolean
        default: false
      max_issues:
        description: 'Maximum issues to create in this run'
        required: false
        type: number
        default: 5

permissions:
  contents: write
  issues: write

jobs:
  scout:
    name: Codebase Health & Tech Debt Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Codebase Audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUDIT_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            AUDIT_FLAGS="--dry-run"
          else
            MAX_ISSUES="${{ github.event.inputs.max_issues }}"
            if [ -z "$MAX_ISSUES" ]; then
              MAX_ISSUES=5
            fi
            AUDIT_FLAGS="--create-issues --max-issues $MAX_ISSUES"
          fi
          echo "Executing audit with flags: $AUDIT_FLAGS"
          python3 .agents/scripts/audit_codebase.py $AUDIT_FLAGS

      - name: Upload Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codebase-audit-reports
          path: agentic-memory/audits/
          if-no-files-found: warn

      - name: Archive Audit Report to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agentic-memory/audits/
          if git diff --staged --quiet; then
            echo "No audit changes to commit."
          else
            git commit -m "chore(audit): record automated codebase audit report [skip ci]"
            git push
          fi
