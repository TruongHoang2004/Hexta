name: Docker CI/CD

on:
  # Every main commit publishes images tagged sha-<7 chars>, so the server can deploy any main commit by its sha.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'services/api/**'
      - 'services/connector/**'
      - 'services/ai/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'go.work'
      - 'go.work.sum'
      - 'pnpm-lock.yaml'
      - 'Dockerfile.migrate'
      - 'atlas.hcl'
      - 'scripts/migrate.sh'
      - 'migrations/**'
      - '.github/workflows/docker-ci-cd.yml'

concurrency:
  group: docker-ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docker-build:
    name: Build & Verify Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        # Images deployed by infrastructure/compose.prod.yml; the server pulls them by sha tag and never builds.
        include:
          - name: api
            context: .
            file: services/api/Dockerfile
          - name: connector
            context: .
            file: services/connector/Dockerfile
          - name: ai
            context: services/ai
            file: services/ai/Dockerfile
          - name: web
            context: .
            file: apps/web/Dockerfile
            # Empty = same-origin API calls (/api/...), so one image serves any domain behind the Caddy edge.
            build-args: |
              NEXT_PUBLIC_API_URL=
          - name: migrator
            context: .
            file: Dockerfile.migrate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
