# Disposable test infrastructure only; never include in the application stack.
name: hexta-connector-fixture
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: fixture
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30
  kafka:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=127.0.0.1:59092
    ports:
      - "127.0.0.1:59092:9092"
