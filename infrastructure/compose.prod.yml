# Single-host production stack for hexta.org (sized for 2 vCPU / 16 GB). Run only through scripts/prod.sh, which
# loads infrastructure/prod/.env. Only Caddy publishes ports (80/443); every other service stays on the internal
# network. Application images are built by CI (.github/workflows/docker-ci-cd.yml) and pulled by HEXTA_IMAGE_TAG;
# the server never builds. compose.prod.build.yml adds local builds for testing only.
name: hexta-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-migrator: &migrator
  image: ${HEXTA_IMAGE_REGISTRY:-ghcr.io/truonghoang2004/hexta}/migrator:${HEXTA_IMAGE_TAG:?Set HEXTA_IMAGE_TAG}
  logging: *logging
  restart: "no"
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      connector:
        condition: service_started
    mem_limit: 256m
    logging: *logging

  # Collation guard (one-shot, runs before every postgres start through Compose). The pgvector image is Debian/glibc;
  # releases before it ran postgres:17.7-alpine (musl). Text sort order differs, so a musl-built data directory
  # started under glibc silently corrupts text B-tree indexes (primary keys included). Postgres starts only on an
  # empty volume (fresh install: init-db.sh writes the marker under glibc) or on a volume carrying the marker that
  # the README.deploy.md section 10a runbook writes after REINDEX and amcheck. It lives in Compose, not in the deploy
  # agent, so it also holds when an older agent deploys this release.
  postgres-collation-guard:
    image: pgvector/pgvector:0.8.1-pg17-bookworm@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: "no"
    user: root
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        d=/var/lib/postgresql/data
        m="$$d/HEXTA_GLIBC_COLLATION_OK"
        if [ -z "$$(ls -A "$$d")" ]; then
          echo "postgres-collation-guard: empty data volume (fresh install); init-db.sh writes the marker"
          exit 0
        fi
        if [ -f "$$m" ]; then
          echo "postgres-collation-guard: glibc collation marker present: $$(head -c 200 "$$m")"
          exit 0
        fi
        echo "postgres-collation-guard: REFUSING TO START POSTGRES. The data volume holds a cluster without" >&2
        echo "HEXTA_GLIBC_COLLATION_OK, so it was created by the previous Alpine (musl) image. Starting this" >&2
        echo "Debian (glibc) pgvector image on it corrupts text indexes. The data was not touched and Postgres" >&2
        echo "stays stopped (the deploy agent rolls back to the previous release). Run the one-time switch in" >&2
        echo "infrastructure/README.deploy.md section 10a (backup, REINDEX, amcheck, marker) first." >&2
        exit 1
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
    mem_limit: 64m
    logging: *logging

  # pgvector build of PostgreSQL 17 (owner decision 2026-11-26) for the AI knowledge store; never start it on a
  # musl-built volume (see postgres-collation-guard and README.deploy.md section 10a). Pinned by digest (tag is
  # mutable; a new glibc changes text sort order): PostgreSQL 17.8, Debian 12.13, glibc 2.36. The same reference is
  # used by postgres-collation-guard, postgres-extensions and scripts/deploy-agent.sh; bump all together
  # (README.deploy.md section 10a, "Image pin").
  postgres:
    image: pgvector/pgvector:0.8.1-pg17-bookworm@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: unless-stopped
    depends_on:
      postgres-collation-guard:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Set API_DB_PASSWORD}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD}
      CONNECTOR_DB_PASSWORD: ${CONNECTOR_DB_PASSWORD:?Set CONNECTOR_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prod/init-db.sh:/docker-entrypoint-initdb.d/10-hexta.sh:ro
    healthcheck:
      # TCP check: the init-time temporary server listens on the socket only, so this passes after init completes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    shm_size: 256m
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging: *logging

  # Confluent cp-kafka (Apache Kafka) in single-node KRaft mode, the same image as the local stack.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: hHx7qL2bQ0eWm1cZ9yK3dA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # A single broker has no replica to fall back on, so fsync every message before acknowledging it.
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms768m -Xmx768m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    mem_limit: 1536m
    logging: *logging

  # Producers never auto-create topics; this job creates them idempotently.
  kafka-topics:
    image: confluentinc/cp-kafka:7.6.1
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for t in hexta.ingress.received.v1 hexta.outbound.intent.v1 hexta.outbound.result.v1
        hexta.connector.health.v1 hexta.orders.events.v1 hexta.messaging.conversations.v1;
        do kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t"
        --partitions 3 --replication-factor 1 || exit 1; done
    logging: *logging

  migrate-api:
    <<: *migrator
    environment:
      MIGRATE_TARGET: api
      API_DATABASE_URL: postgres://hexta_api:${API_DB_PASSWORD}@postgres:5432/hexta?sslmode=disable&search_path=public
    command: ["apply"]

  # Superuser one-shot: pgvector is not a trusted extension, so the non-superuser AI migrator cannot create it.
  # init-db.sh covers a new volume; this idempotent job covers an existing one. It never touches application tables.
  postgres-extensions:
    image: pgvector/pgvector:0.8.1-pg17-bookworm@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    entrypoint: ["psql", "-h", "postgres", "-U", "postgres", "-d", "hexta", "-v", "ON_ERROR_STOP=1", "-c", "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public"]
    logging: *logging

  migrate-ai:
    <<: *migrator
    depends_on:
      postgres:
        condition: service_healthy
      postgres-extensions:
        condition: service_completed_successfully
    environment:
      MIGRATE_TARGET: ai
      AI_DATABASE_URL: postgres://hexta_ai:${AI_DB_PASSWORD}@postgres:5432/hexta?sslmode=disable
    command: ["apply"]

  migrate-connector:
    <<: *migrator
    environment:
      MIGRATE_TARGET: connector
      CONNECTOR_DATABASE_URL: postgres://hexta_connector:${CONNECTOR_DB_PASSWORD}@postgres:5432/hexta_connector?sslmode=disable
    command: ["apply"]

  # Conversation write side; the api service forwards conversation writes here. Not routed by Caddy.
  messaging-command:
    image: ${HEXTA_IMAGE_REGISTRY:-ghcr.io/truonghoang2004/hexta}/api:${HEXTA_IMAGE_TAG:?Set HEXTA_IMAGE_TAG}
    restart: unless-stopped
    command: ["./messaging-command"]
    depends_on:
      migrate-api:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?Set JWT_ACCESS_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:?Set JWT_REFRESH_TOKEN_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Set AI_INTERNAL_TOKEN}
      # The reply router and knowledge sync call the AI service over gRPC (ai.run_addr in prod/api.yaml).
      AI_RUN_ADDR: ai:50051
      CONNECTOR_MANAGEMENT_TOKEN: ${CONNECTOR_MANAGEMENT_TOKEN:?Set CONNECTOR_MANAGEMENT_TOKEN}
      META_APP_ID: ${META_APP_ID:-}
    volumes:
      - ./prod/api.yaml:/app/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 15
    mem_limit: 256m
    logging: *logging

  api:
    image: ${HEXTA_IMAGE_REGISTRY:-ghcr.io/truonghoang2004/hexta}/api:${HEXTA_IMAGE_TAG:?Set HEXTA_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      migrate-api:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      messaging-command:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?Set JWT_ACCESS_TOKEN_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${JWT_REFRESH_TOKEN_SECRET:?Set JWT_REFRESH_TOKEN_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?Set AI_INTERNAL_TOKEN}
      CONNECTOR_MANAGEMENT_TOKEN: ${CONNECTOR_MANAGEMENT_TOKEN:?Set CONNECTOR_MANAGEMENT_TOKEN}
      META_APP_ID: ${META_APP_ID:-}
    volumes:
      - ./prod/api.yaml:/app/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 15
    mem_limit: 512m
    logging: *logging

  # Kafka consumer: ingress events, outbound results and connector health.
  ingress:
    image: ${HEXTA_IMAGE_REGISTRY:-ghcr.io/truonghoang2004/hexta}/api:${HEXTA_IMAGE_TAG:?Set HEXTA_IMAGE_TAG}
    restart: unless-stopped
    command: ["./ingress"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DATABASE_URL: postgresql://hexta_api:${API_DB_PASSWORD}@postgres:5432/hexta?sslmode=disable&search_path=public
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
    mem_limit: 256m
    logging: *logging

  ai:
    image: ${HEXTA_IMAGE_REGISTRY:-ghcr.io/truonghoang2004/hexta}/ai:${HEXTA_IMAGE_TAG:?Set HEXTA_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      migrate-ai:
        condition: service_completed_successfully
    environment:
      AI_DATABASE_URL: postgresql://hexta_ai:${AI_DB_PASSWORD}@postgres:5432/hexta?sslmode=disable
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN}
      # Owner decision 2026-11-26: AI is OFF until fully configured. Default: exact scripts only, everything else to
      # staff, no paid call. Enabling sets Claude + Jev + Gemini embeddings together (README.deploy.md, "AI
      # settings"). Missing or partial settings keep AI disabled with a logged reason; the service still starts.
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # AI_JEV_ENABLED=true without TYPESAFE_API_KEY is logged as an error and Jev stays off.
      AI_JEV_ENABLED: ${AI_JEV_ENABLED:-false}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # fake = offline hashing; gemini needs GEMINI_API_KEY and is used only while AI is enabled.
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-fake}
      AI_RAG_MIN_SIMILARITY: ${AI_RAG_MIN_SIMILARITY:-0.55}
      LANGSMITH_TRACING: "false"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 15
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    logging: *logging

  connector:
    image: ${HEXTA_IMAGE_REGISTRY:-ghcr.io/truonghoang2004/hexta}/connector:${HEXTA_IMAGE_TAG:?Set HEXTA_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      migrate-connector:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    environment:
      CONNECTOR_DATABASE_URL: postgres://hexta_connector:${CONNECTOR_DB_PASSWORD}@postgres:5432/hexta_connector?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONNECTOR_LISTEN_ADDR: 0.0.0.0:8091
      CONNECTOR_MANAGEMENT_TOKEN_FILE: /run/secrets/connector_management_token
      CONNECTOR_CREDENTIAL_KEY_FILE: /run/secrets/connector_credential_key
      META_APP_ID: ${META_APP_ID:-facebook-disabled}
      META_APP_SECRET_FILE: /run/secrets/meta_app_secret
      META_VERIFY_TOKEN_FILE: /run/secrets/meta_verify_token
      TELEGRAM_WEBHOOK_BASE_URL: https://${DOMAIN}
    secrets:
      - connector_management_token
      - connector_credential_key
      - meta_app_secret
      - meta_verify_token
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging: *logging

  # The image calls the API on its own origin (Caddy routes /api/*), so auth cookies stay first-party.
  web:
    image: ${HEXTA_IMAGE_REGISTRY:-ghcr.io/truonghoang2004/hexta}/web:${HEXTA_IMAGE_TAG:?Set HEXTA_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 512m
    logging: *logging

secrets:
  connector_management_token:
    file: ./prod/secrets/connector_management_token
  connector_credential_key:
    file: ./prod/secrets/connector_credential_key
  meta_app_secret:
    file: ./prod/secrets/meta_app_secret
  meta_verify_token:
    file: ./prod/secrets/meta_verify_token

volumes:
  postgres_data:
  kafka_data:
  caddy_data:
  caddy_config:
