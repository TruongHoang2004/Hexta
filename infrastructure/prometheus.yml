global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api'
    static_configs:
      - targets: ['api:9090']

  - job_name: 'catalog'
    static_configs:
      - targets: ['catalog:8083']

  - job_name: 'merchant'
    static_configs:
      - targets: ['merchant:8082']

  - job_name: 'user'
    static_configs:
      - targets: ['user:8080']
