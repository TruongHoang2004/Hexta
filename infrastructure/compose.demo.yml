# Standalone local dependencies; does not load the root .env or existing volumes.
name: hexta-demo
services:
  postgres:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_DB: hexta_demo
      POSTGRES_USER: hexta_demo
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexta_demo -d hexta_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db-init:
    image: postgres:17.7-alpine3.23
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: local-demo-only
    volumes:
      - ./local/init.sql:/init.sql:ro
    entrypoint: ["psql", "-h", "postgres", "-U", "hexta_demo", "-d", "hexta_demo", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MIGRATE_TARGET: api
      API_DATABASE_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_demo?sslmode=disable&search_path=public
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations:ro
  migrate-ai:
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MIGRATE_TARGET: ai
      AI_DATABASE_URL: postgres://hexta_ai:local-ai-only@postgres:5432/hexta_demo?sslmode=disable
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations:ro
  migrator:
    profiles: [tools]
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    environment:
      MIGRATE_TARGET: all
      API_DATABASE_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_demo?sslmode=disable&search_path=public
      AI_DATABASE_URL: postgres://hexta_ai:local-ai-only@postgres:5432/hexta_demo?sslmode=disable
      API_DEV_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_atlas_dev_api?sslmode=disable&search_path=public
      AI_DEV_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_atlas_dev_ai?sslmode=disable
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      JWT_ACCESS_TOKEN_SECRET: ${LOCAL_JWT_ACCESS_SECRET:?Set LOCAL_JWT_ACCESS_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${LOCAL_JWT_REFRESH_SECRET:?Set LOCAL_JWT_REFRESH_SECRET}
    volumes:
      - ./local/api.yaml:/app/config/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  ai:
    depends_on:
      migrate-ai:
        condition: service_completed_successfully
    build:
      context: ../services/ai
    environment:
      AI_DATABASE_URL: postgresql://hexta_ai:local-ai-only@postgres:5432/hexta_demo?sslmode=disable
      AI_PROVIDER: fake
      AI_INTERNAL_TOKEN: ${DEMO_AI_INTERNAL_TOKEN:?Set DEMO_AI_INTERNAL_TOKEN to a random local service token}
      LANGSMITH_TRACING: "false"
    ports:
      - "127.0.0.1:58000:8000"
      - "127.0.0.1:55051:50051"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  test-postgres:
    profiles: ["test"]
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_USER: ai_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: ai_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ai_test", "-d", "ai_test"]
      interval: 2s
      timeout: 2s
      retries: 15
  test-migrate-ai:
    profiles: [test]
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    environment:
      MIGRATE_TARGET: ai
      AI_DATABASE_URL: postgres://ai_test:test-only@test-postgres:5432/ai_test?sslmode=disable
    depends_on:
      test-postgres:
        condition: service_healthy
  ai-tests:
    profiles: ["test"]
    build:
      context: ../services/ai
      target: test
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations:ro
      - ../scripts/migrate.sh:/workspace/scripts/migrate.sh:ro
    environment:
      ATLAS_PROJECT_ROOT: /workspace
      AI_TEST_DATABASE_URL: postgresql://ai_test:test-only@test-postgres:5432/ai_test?sslmode=disable
    depends_on:
      test-migrate-ai:
        condition: service_completed_successfully
volumes:
  demo_postgres:
