# Standalone local dependencies; does not load the root .env or existing volumes.
name: hexta-demo
services:
  postgres:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_DB: hexta_demo
      POSTGRES_USER: hexta_demo
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexta_demo -d hexta_demo"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  # Confluent cp-kafka in single-node KRaft mode, the same image as production. Containers use kafka:9092;
  # host tools use 127.0.0.1:59092.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      CLUSTER_ID: lQ4cDm8vT1nYx5zR2aB7eF
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:59092:29092"
    volumes:
      - demo_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
  # Producers never auto-create topics; this job creates them idempotently (same list as production).
  kafka-topics:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for t in hexta.ingress.received.v1 hexta.outbound.intent.v1 hexta.outbound.result.v1
        hexta.connector.health.v1 hexta.orders.events.v1 hexta.messaging.conversations.v1;
        do kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$t"
        --partitions 3 --replication-factor 1 || exit 1; done
  db-init:
    image: postgres:17.7-alpine3.23
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: local-demo-only
    volumes:
      - ./local/init.sql:/init.sql:ro
    entrypoint: ["psql", "-h", "postgres", "-U", "hexta_demo", "-d", "hexta_demo", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MIGRATE_TARGET: api
      API_DATABASE_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_demo?sslmode=disable&search_path=public
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations:ro
  migrate-ai:
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MIGRATE_TARGET: ai
      AI_DATABASE_URL: postgres://hexta_ai:local-ai-only@postgres:5432/hexta_demo?sslmode=disable
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations:ro
  migrator:
    profiles: [tools]
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    environment:
      MIGRATE_TARGET: all
      API_DATABASE_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_demo?sslmode=disable&search_path=public
      AI_DATABASE_URL: postgres://hexta_ai:local-ai-only@postgres:5432/hexta_demo?sslmode=disable
      API_DEV_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_atlas_dev_api?sslmode=disable&search_path=public
      AI_DEV_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_atlas_dev_ai?sslmode=disable
      CONNECTOR_DATABASE_URL: postgres://hexta_connector:local-connector-only@postgres:5432/hexta_connector?sslmode=disable
      CONNECTOR_DEV_URL: postgres://hexta_demo:local-demo-only@postgres:5432/hexta_atlas_dev_connector?sslmode=disable
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations
  migrate-connector:
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MIGRATE_TARGET: connector
      CONNECTOR_DATABASE_URL: postgres://hexta_connector:local-connector-only@postgres:5432/hexta_connector?sslmode=disable
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations:ro
  connector:
    build:
      context: ..
      dockerfile: services/connector/Dockerfile
    depends_on:
      migrate-connector:
        condition: service_completed_successfully
      kafka-topics:
        condition: service_completed_successfully
    environment:
      CONNECTOR_DATABASE_URL: postgres://hexta_connector:local-connector-only@postgres:5432/hexta_connector?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      CONNECTOR_LISTEN_ADDR: 0.0.0.0:8091
      CONNECTOR_MANAGEMENT_TOKEN_FILE: /run/secrets/connector_management_token
      CONNECTOR_CREDENTIAL_KEY_FILE: /run/secrets/connector_credential_key
      # Placeholder app: webhooks/OAuth stay inert until real Meta credentials are configured.
      META_APP_ID: facebook-disabled
      META_APP_SECRET_FILE: /run/secrets/meta_app_secret
      META_VERIFY_TOKEN_FILE: /run/secrets/meta_verify_token
      # Public HTTPS origin forwarded to webhook-proxy (for example a cloudflared tunnel); empty disables Telegram.
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
    secrets:
      - connector_management_token
      - connector_credential_key
      - meta_app_secret
      - meta_verify_token
    ports:
      - "127.0.0.1:58091:8091"
    read_only: true
    security_opt:
      - no-new-privileges:true
  # Only the provider webhooks, for a tunnel to http://localhost:58092; never /internal/*.
  webhook-proxy:
    image: caddy:2.8-alpine
    depends_on:
      - connector
    volumes:
      - ./local/Caddyfile.webhooks:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:58092:8092"
    read_only: true
    tmpfs:
      - /config
      - /data
    security_opt:
      - no-new-privileges:true
  # Kafka consumer: ingress events, outbound results and connector health.
  ingress:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["./ingress"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DATABASE_URL: postgresql://hexta_demo:local-demo-only@postgres:5432/hexta_demo?sslmode=disable&search_path=public
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
  # Conversation write side; the api service forwards conversation writes here.
  messaging-command:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["./messaging-command"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      JWT_ACCESS_TOKEN_SECRET: ${LOCAL_JWT_ACCESS_SECRET:?Set LOCAL_JWT_ACCESS_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${LOCAL_JWT_REFRESH_SECRET:?Set LOCAL_JWT_REFRESH_SECRET}
      CONNECTOR_MANAGEMENT_TOKEN: ${LOCAL_CONNECTOR_MANAGEMENT_TOKEN:?Set LOCAL_CONNECTOR_MANAGEMENT_TOKEN}
    volumes:
      - ./local/api.yaml:/app/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      messaging-command:
        condition: service_healthy
    environment:
      # Overridden by compose.mock.yml; the placeholder keeps Facebook connect inert.
      META_APP_ID: facebook-disabled
      META_OAUTH_DIALOG_URL: ""
      JWT_ACCESS_TOKEN_SECRET: ${LOCAL_JWT_ACCESS_SECRET:?Set LOCAL_JWT_ACCESS_SECRET}
      JWT_REFRESH_TOKEN_SECRET: ${LOCAL_JWT_REFRESH_SECRET:?Set LOCAL_JWT_REFRESH_SECRET}
      CONNECTOR_MANAGEMENT_TOKEN: ${LOCAL_CONNECTOR_MANAGEMENT_TOKEN:?Set LOCAL_CONNECTOR_MANAGEMENT_TOKEN}
      # Optional Google login; empty values keep it disabled.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./local/api.yaml:/app/config/config.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
  ai:
    depends_on:
      migrate-ai:
        condition: service_completed_successfully
    build:
      context: ../services/ai
    environment:
      AI_DATABASE_URL: postgresql://hexta_ai:local-ai-only@postgres:5432/hexta_demo?sslmode=disable
      AI_PROVIDER: fake
      AI_INTERNAL_TOKEN: ${DEMO_AI_INTERNAL_TOKEN:?Set DEMO_AI_INTERNAL_TOKEN to a random local service token}
      LANGSMITH_TRACING: "false"
    ports:
      - "127.0.0.1:58000:8000"
      - "127.0.0.1:55051:50051"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  test-postgres:
    profiles: ["test"]
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_USER: ai_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: ai_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ai_test", "-d", "ai_test"]
      interval: 2s
      timeout: 2s
      retries: 15
  test-migrate-ai:
    profiles: [test]
    build:
      context: ..
      dockerfile: Dockerfile.migrate
    environment:
      MIGRATE_TARGET: ai
      AI_DATABASE_URL: postgres://ai_test:test-only@test-postgres:5432/ai_test?sslmode=disable
    depends_on:
      test-postgres:
        condition: service_healthy
  ai-tests:
    profiles: ["test"]
    build:
      context: ../services/ai
      target: test
    volumes:
      - ../atlas.hcl:/workspace/atlas.hcl:ro
      - ../migrations:/workspace/migrations:ro
      - ../scripts/migrate.sh:/workspace/scripts/migrate.sh:ro
    environment:
      ATLAS_PROJECT_ROOT: /workspace
      AI_TEST_DATABASE_URL: postgresql://ai_test:test-only@test-postgres:5432/ai_test?sslmode=disable
    depends_on:
      test-migrate-ai:
        condition: service_completed_successfully
# Connector secrets are generated by scripts/local.sh from the git-ignored infrastructure/.env.local.
secrets:
  connector_management_token:
    file: ./.env.local.secrets/connector_management_token
  connector_credential_key:
    file: ./.env.local.secrets/connector_credential_key
  meta_app_secret:
    file: ./.env.local.secrets/meta_app_secret
  meta_verify_token:
    file: ./.env.local.secrets/meta_verify_token
volumes:
  demo_postgres:
  demo_kafka:
