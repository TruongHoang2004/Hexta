# Template for an existing nginx that owns ports 80/443 and shares a Docker network with Hexta's Caddy
# (compose.prod.shared-edge.yml). Replace app.hexta.org with your DOMAIN. Intended behind the Cloudflare proxy:
# the origin certificate is a Cloudflare Origin CA certificate (SSL/TLS mode Full (strict)), so no certbot or
# renewal is needed. Reload only after `nginx -t` succeeds.

server {
    listen 80;
    listen [::]:80;
    server_name app.hexta.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.hexta.org;

    # Docker DNS, resolved per request so nginx starts even while Hexta is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/hexta-origin/cert.pem;
    ssl_certificate_key /etc/letsencrypt/hexta-origin/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL_HEXTA:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location / {
        set $hexta_edge http://hexta-edge:80;
        proxy_pass $hexta_edge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events (conversation stream) must not be buffered; it closes itself after ~10 minutes.
        proxy_buffering off;
        proxy_read_timeout 900s;
    }
}
