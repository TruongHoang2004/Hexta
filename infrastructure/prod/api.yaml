# Production API configuration. Values come from infrastructure/prod/.env through Compose; never put secrets here.
server:
  name: hexta_api
  port: 8080
  production: true
  trace: false
  frontend_url: https://${DOMAIN}
database:
  url: postgresql://hexta_api:${API_DB_PASSWORD}@postgres:5432/hexta?sslmode=disable&search_path=public
redis:
  addr: redis:6379
jwt:
  access_token_secret: ${JWT_ACCESS_TOKEN_SECRET}
  access_token_expire: 3600
  refresh_token_secret: ${JWT_REFRESH_TOKEN_SECRET}
  refresh_token_expire: 604800
oauth:
  google:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    redirect_url: https://${DOMAIN}/api/v1/auth/google/callback
# The Python AI runtime owns provider calls; these legacy Go provider fields stay inert.
ai:
  consult_url: http://ai:8000
  # Internal AIService gRPC host:port for the reply router and knowledge sync (messaging-command). Empty hands
  # conversations that no script answers to staff; a set address needs AI_INTERNAL_TOKEN (>= 24 characters).
  run_addr: ${AI_RUN_ADDR}
  internal_token: ${AI_INTERNAL_TOKEN}
  provider: fake
  base_url: http://127.0.0.1:1
  timeout: 30
  max_tokens: 512
  temperature: 0
messaging:
  command_url: http://messaging-command:8082
  command_port: "8082"
kafka:
  brokers: kafka:9092
connector:
  url: http://connector:8091
  management_token: ${CONNECTOR_MANAGEMENT_TOKEN}
facebook:
  app_id: ${META_APP_ID}
  graph_version: v21.0
  dialog_url: ''
