syntax = "proto3";

package user;

option go_package = "gitlab.com/ecommercehub1/user/proto;proto";

import "google/protobuf/timestamp.proto";

// =====================
// Message Definitions
// =====================

enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
}

message User {
  string id = 1;
  string full_name = 2;
  Gender gender = 3;
  string date_of_birth = 4;
  string user_name = 5;
  optional string email = 6;
  optional string phone = 7;

  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// =====================
// Create User
// =====================

message CreateUserRequest {
  string full_name = 1;
  Gender gender = 2;
  string date_of_birth = 3;
  string user_name = 4;
  optional string email = 5;
  optional string phone = 6;
}

message CreateUserResponse {
  User user = 1;
}

// =====================
// Get User
// =====================

message GetUserRequest {
  string id = 1;
}

message GetUsersRequest {
  repeated string ids = 1;
}

message GetUsersResponse {
  repeated User users = 1;
}

message GetUserResponse {
  User user = 1;
}

// =====================
// List Users
// =====================

enum UserFilterField {
  USER_FILTER_FIELD_UNSPECIFIED = 0;
  USER_FILTER_FIELD_USER_NAME = 1;
  USER_FILTER_FIELD_FULL_NAME = 2;
  USER_FILTER_FIELD_EMAIL = 3;
  USER_FILTER_FIELD_GENDER = 4;
  USER_FILTER_FIELD_PHONE = 5;
  USER_FILTER_FIELD_DATE_OF_BIRTH = 6;
}

enum OrderBy {
  ORDER_BY_UNSPECIFIED = 0;
  ORDER_BY_ASC = 1;
  ORDER_BY_DESC = 2;
}

message ListUsersRequest {
  optional int32 page = 1;
  optional int32 limit = 2;
  // map keys are UserFilterField values
  map<int32, string> filters = 3;
  optional UserFilterField sort = 4;
  optional OrderBy order = 5;
  optional string search = 6;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

// =====================
// Delete User (Soft Delete)
// =====================

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

// =====================
// Service
// =====================

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}
