host: localhost:9090
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API documentation for CommerceHub backend service.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: CommerceHub API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return access/refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Login user
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Use refresh token to get a new access token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_RefreshTokenResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with the provided details
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_RegisterResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
  /auth/validate-token:
    get:
      consumes:
      - application/json
      description: Check if the provided access token is valid
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Validate access token
      tags:
      - Authentication
  /merchants/:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of merchants
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: size
        type: integer
      - description: Global search
        in: query
        name: search
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by name
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_ListMerchantsResponse'
      security:
      - BearerAuth: []
      summary: List merchants
      tags:
      - Merchants
    post:
      consumes:
      - application/json
      description: Register a new merchant profile for the authenticated user
      parameters:
      - description: Merchant details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_dto.CreateMerchantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_MerchantResponse'
      security:
      - BearerAuth: []
      summary: Create merchant profile
      tags:
      - Merchants
    put:
      consumes:
      - application/json
      description: Update existing merchant information
      parameters:
      - description: Updated merchant details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_dto.UpdateMerchantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_MerchantResponse'
      security:
      - BearerAuth: []
      summary: Update merchant profile
      tags:
      - Merchants
  /users/:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of users
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Page size
        in: query
        name: size
        type: integer
      - description: Global search
        in: query
        name: search
        type: string
      - description: Filter by username
        in: query
        name: user_name
        type: string
      - description: Filter by full name
        in: query
        name: full_name
        type: string
      - description: Filter by email
        in: query
        name: email
        type: string
      - description: Filter by gender
        in: query
        name: gender
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_ListUsersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Users
  /users/me:
    get:
      consumes:
      - application/json
      description: Retrieve the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gitlab_com_ecommercehub1_api_internal_present_http_response.Response-gitlab_com_ecommercehub1_api_internal_present_http_dto_UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
