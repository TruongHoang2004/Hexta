[project]
name = "hexta-ai"
version = "0.1.0"
description = "Hexta candidate routing with durable runs and pluggable AI providers"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langgraph>=1,<2",
  "langsmith>=0.14,<1",
  "grpcio>=1.84,<2",
  "protobuf>=7.36.2,<8",
  "psycopg[binary,pool]>=3.2,<4",
  "langchain>=1,<2",
  "langchain-google-genai>=4,<5",
  "langchain-openai>=1,<2",
  "langchain-anthropic>=1,<2",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2,<3",
  "pytest>=8,<10",
  "grpcio-tools>=1.84,<2",
  "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "generated"]
