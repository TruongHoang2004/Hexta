[project]
name = "hexta-ai"
version = "0.1.0"
description = "Hexta AI service bootstrap with an offline simulation graph"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langgraph>=1,<2",
  "langsmith>=0.14,<1",
  "grpcio>=1.84,<2",
  "protobuf>=7.36.2,<8",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "grpcio-tools>=1.84,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "generated"]
