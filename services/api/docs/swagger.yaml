    - OrderStatusConfirmed
    - OrderStatusProcessing
    - OrderStatusFulfilled
    - OrderStatusCancelled
    - OrderStatusReturned
  github_com_TruongHoang2004_Hexta_services_api_internal_core_model.PaymentStatus:
    enum:
