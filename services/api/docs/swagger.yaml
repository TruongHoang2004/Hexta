host: localhost:9090
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API documentation for CommerceHub backend service.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: CommerceHub API
  version: "1.0"
paths:
  /api/v1/ai/agent/converse:
    post:
      consumes:
      - application/json
      description: Stream interactive conversational turns and order drafts via Server-Sent
        Events (SSE)
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Tenant Workspace ID
        in: query
        name: tenant_id
        type: string
      - description: Conversational prompt and history
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.AIConverseRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Server-Sent Event stream emitting JSON dto.SSEEvent chunks
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Converse with AI Agent
      tags:
      - AI Agent
  /api/v1/ai/agent/drafts/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a Redis-cached order draft by draft ID for human review
        and confirmation
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Tenant Workspace ID
        in: query
        name: tenant_id
        type: string
      - description: Draft ID (e.g. draft_8f3a9b21-4c5d)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_response.Response-github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto_OrderDraftDTO'
      security:
      - BearerAuth: []
      summary: Retrieve interactive order draft
      tags:
      - AI Agent
  /api/v1/auth/google/callback:
    get:
      description: Handles Google OAuth callback, validates state, and redirects to
        frontend with secure cookies
      parameters:
      - description: OAuth code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth CSRF state
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: Google OAuth callback
      tags:
      - Auth
  /api/v1/auth/google/login:
    get:
      description: Redirects to Google consent screen with secure CSRF state
      responses:
        "302":
          description: Found
      summary: Google OAuth login
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.LoginResponse'
      summary: Login user
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the user's current or specified session (enforcing ownership)
      parameters:
      - description: Logout request
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.RefreshTokenResponse'
      summary: Refresh access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with email and password
      parameters:
      - description: Register credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.RegisterResponse'
      summary: Register user
      tags:
      - Auth
  /api/v1/orders:
    get:
      consumes:
      - application/json
      description: Retrieve paginated orders for a workspace
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Tenant Workspace ID
        in: query
        name: tenant_id
        type: string
      - description: Filter by order status
        in: query
        name: status
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Page size (default: 20)'
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_response.Response-github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto_OrderListResponse'
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Create order draft or auto-confirm with stock reservation
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Order creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_response.Response-github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto_OrderResponse'
      security:
      - BearerAuth: []
      summary: Create a new order
      tags:
      - Orders
  /api/v1/orders/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a specific order by ID
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Tenant Workspace ID
        in: query
        name: tenant_id
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_response.Response-github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto_OrderResponse'
      security:
      - BearerAuth: []
      summary: Get order details
      tags:
      - Orders
  /api/v1/orders/{id}/payment:
    patch:
      consumes:
      - application/json
      description: Update payment status of an order
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Tenant Workspace ID
        in: query
        name: tenant_id
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Payment status payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.UpdatePaymentStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_response.Response-github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto_OrderResponse'
      security:
      - BearerAuth: []
      summary: Update order payment status
      tags:
      - Orders
  /api/v1/orders/{id}/status:
    patch:
      consumes:
      - application/json
      description: Transition order status following FSM rules (draft -> confirmed
        -> processing -> fulfilled/cancelled)
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Tenant Workspace ID
        in: query
        name: tenant_id
        type: string
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Target status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.UpdateOrderStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_response.Response-github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto_OrderResponse'
      security:
      - BearerAuth: []
      summary: Transition order lifecycle state
      tags:
      - Orders
  /api/v1/tenants:
    get:
      consumes:
      - application/json
      description: Get all workspaces the authenticated user belongs to
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_response.Response-array_github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto_TenantResponse'
      security:
      - BearerAuth: []
      summary: List user workspaces
      tags:
