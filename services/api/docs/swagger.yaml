paths:
  /api/v1/ai/converse:
    post:
      consumes:
      - application/json
      description: Stream interactive conversational turns and order drafts via Server-Sent
        Events (SSE)
      parameters:
      - description: Tenant Workspace ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: Tenant Workspace ID
        in: query
        name: tenant_id
        type: string
      - description: Conversational prompt and history
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TruongHoang2004_Hexta_services_api_internal_present_http_dto.AIConverseRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: Named message, products, draft_order, quick_replies, done and
            error events; data is dto.SSEEvent
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ErrorResponse'
