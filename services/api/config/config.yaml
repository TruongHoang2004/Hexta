server:
  name: ecommercehub_api
  port: 8080
  production: false
  trace: false

database:
  url: "postgresql://postgres:postgres@localhost:5433/api?sslmode=disable"

service:

jwt:
  access_token_secret: ${JWT_ACCESS_TOKEN_SECRET}
  access_token_expire: ${JWT_ACCESS_TOKEN_EXPIRE}
  refresh_token_secret: ${JWT_REFRESH_TOKEN_SECRET}
  refresh_token_expire: ${JWT_REFRESH_TOKEN_EXPIRE}

redis:
  addr: localhost:6379

oauth:
  google:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    redirect_url: ${GOOGLE_REDIRECT_URL}
