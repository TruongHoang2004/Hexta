syntax = "proto3";

package identity.v1;

option go_package = "gitlab.com/ecommercehub1/shared/gen/go/identity/v1;identityv1";

import "google/protobuf/timestamp.proto";

// --- Enums ---
enum TenantStatus {
  TENANT_STATUS_UNSPECIFIED = 0;
  TENANT_STATUS_PENDING = 1;
  TENANT_STATUS_ACTIVE = 2;
  TENANT_STATUS_SUSPENDED = 3;
  TENANT_STATUS_DELETED = 4;
}

enum TenantPlan {
  TENANT_PLAN_UNSPECIFIED = 0;
  TENANT_PLAN_FREE = 1;
  TENANT_PLAN_PRO = 2;
  TENANT_PLAN_ENTERPRISE = 3;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_PENDING = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_INACTIVE = 3;
  USER_STATUS_DELETED = 4;
}

// --- Messages ---
message Tenant {
  string id = 1;
  string name = 2;
  string slug = 3;
  TenantStatus status = 4;
  TenantPlan plan = 5;
  string owner_id = 6;
  string contact_email = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message User {
  string id = 1;
  string tenant_id = 2;
  string email = 3;
  string full_name = 4;
  string avatar_url = 5;
  UserStatus status = 6;
  string role_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message Role {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string description = 4;
  bool is_system = 5;
  repeated string permissions = 6;
}

// --- Requests & Responses ---
message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool is_valid = 1;
  string user_id = 2;
  string tenant_id = 3;
  string role_id = 4;
  repeated string permissions = 5;
}

message CheckPermissionRequest {
  string user_id = 1;
  string tenant_id = 2;
  string permission = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message GetUserRequest {
  string id = 1;
  string tenant_id = 2;
}

message GetUserResponse {
  User user = 1;
}

message GetTenantRequest {
  string id = 1;
}

message GetTenantResponse {
  Tenant tenant = 1;
}

// --- Services ---
service IdentityService {
  // Authentication & Authorization (Internal API Gateway usage)
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  
  // User Management
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  
  // Tenant Management
  rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
}
